<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #fff7fb, #fff1e6, #f4f1ff);
    color: #332833;
  }

  .gallery-page {
    max-width: 1100px;
    margin: auto;
    padding: 35px 18px;
  }

  .gallery-header {
    display: flex;
    justify-content: space-between;
    align-items: end;
    gap: 15px;
    margin-bottom: 20px;
  }

  .gallery-header h1 {
    margin: 0;
    font-size: 48px;
  }

  .tags span,
  .mini-tags span {
    display: inline-block;
    border-radius: 999px;
    padding: 7px 12px;
    background: white;
    color: #c94f7c;
    font-weight: bold;
    box-shadow: 0 8px 20px rgba(0,0,0,.08);
  }

  .photo-scroll {
    display: flex;
    gap: 18px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    padding: 10px 4px 25px;
  }

  .photo-card {
    flex: 0 0 300px;
    scroll-snap-align: start;
    border-radius: 22px;
    padding: 10px;
    background: rgba(255,255,255,.75);
    box-shadow: 0 18px 45px rgba(79,45,73,.16);
  }

  .photo-card img {
    width: 100%;
    height: 370px;
    object-fit: cover;
    border-radius: 16px;
    display: block;
  }

  .caption {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 4px 2px;
    gap: 10px;
  }

  .mini-tags {
    display: flex;
    gap: 6px;
  }

  .mini-tags span {
    font-size: 12px;
    padding: 5px 8px;
  }

  .buttons {
    text-align: center;
  }

  .buttons button {
    width: 45px;
    height: 45px;
    border: 0;
    border-radius: 50%;
    background: white;
    color: #e85d8d;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(0,0,0,.12);
  }

  @media (max-width: 600px) {
    .gallery-header {
      display: block;
    }

    .gallery-header h1 {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .photo-card {
      flex-basis: 82vw;
    }
  }
</style>
